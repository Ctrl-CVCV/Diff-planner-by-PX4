frame_id: world
coordinate_mode: takeoff_relative
planner_node: /drone_0_diff_planner_node
traj_server_node: /drone_0_traj_server
controller_node: /px4ctrl

# z_offset：该航点实测地面高度相对起飞原点地面的偏差（米），默认 0。
# 正数 = 该点地面比起飞点高，任务脚本会把该偏移加到该点所有高度目标上（含投放/进近的
# 离地高度），保证离地间隙仍是配置值。实测各点地面高低差后逐点填写，范围 ±0.30m。
points:
  A: {xyz: [0.0, 0.0, 0.0], yaw_deg: 0.0}
  B: {xyz: [1.75, 0.00, 0.8], yaw_deg: 0.0, z_offset: 0.00, measured: true}
  C: {xyz: [0.359, 1.521, 0.80],yaw_deg: 180.0, z_offset: -0.027, measured: true}
  D: {xyz: [-0.093, 1.498, 0.8], yaw_deg: 180.0, z_offset: -0.020, measured: true}
  E: {xyz: [1.803, 2.844, 0.8], yaw_deg: 90.0, measured: true, z_offset: -0.048}
  # F 是 Planner → 直控的切换点：到点悬停 arrival_dwell 秒后切直控。实测后填坐标并把 measured 改成 true。
  # F、G 与 E 一样可能出现"救助人员"，z_offset 要逐点实测填写。
  F: {xyz: [0.974, 2.807, 0.8], yaw_deg: 90.0, measured: true, z_offset: -0.059}
  # G、H 由普通 PX4Ctrl 直控，各自到点悬停 arrival_dwell 秒；实测后填坐标并改 measured。
  G: {xyz: [2.560, 2.866, 0.8], yaw_deg: 90.0, measured: true, z_offset: -0.074}
  H: {xyz: [1.796, 2.840, 0.8], yaw_deg: 180.0, measured: true, z_offset: -0.060}
  # I 是终点：回到 起点上方，航向与起飞时相反（180°）。z 用飞行高度 0.8，不能填地面 0。
  # y=-0.10 是实测落点左偏的经验补偿：world y 指向起飞航向的左侧，取 -0.10 即向右挪 10cm。
  # 这个值按实测落点偏差调整，不是原始测量坐标；改完仍会按 landing/target_tolerance 收敛后再降落。
  I: {xyz: [0.00, 0.05, 0.8], yaw_deg: 180.0}

takeoff:
  height: 0.80
  timeout: 60.0
  ack_timeout: 5.0
  fcu_confirm_timeout: 2.0
  hover_seconds: 3.00
  corridor_radius: 0.20
  max_sink: 0.10

direct:
  max_speed: 0.20
  max_acceleration: 0.30
  max_jerk: 1.0
  min_duration: 3.0
  max_yaw_rate_deg: 25.0

# 降落。PX4Ctrl 收到 LAND 时会把**那一刻的实测位姿**冻结成降落参考（x、y、yaw 固定，
# z 按 0.15m/s 时序斜坡下降），所以真正决定落点的是"发 LAND 时的实测位置"，不是高度。
# target_* 就是这条判据：比 safety/position_tolerance(0.10m)、arrival_speed(0.20m/s) 更紧。
landing:
  # 可选进近：>0 时先在位置控制下降到离地该高度再发 LAND，只缩短"冻结参考"被估计漂移
  # 影响的窗口（0.8m→0.1m 约省 4.6s），默认关掉。
  approach_height: 0.0
  approach_speed: 0.15
  approach_tolerance: 0.02
  approach_timeout: 20.0
  target_tolerance: 0.03
  target_speed: 0.05
  # 收不紧时的兜底：超过该时长就按当前位姿降落并告警，不无限等待。
  target_timeout: 8.0
  # 收尾判据：实测离地高度（/ekf/ekf_odom，相对起飞原点）≤ 该值即视为已在地面。
  # 本机 PX4 没有外部定位融合，落地后 landed_state 可能长期停在 IN_AIR；此时 PX4Ctrl
  # 自己的落地判据成立 5s 后会把控制交还飞手，任务脚本据此收尾并提示杀桨，
  # 不再报"状态异常"。仍可正常解锁的事件流（PX4 报 ON_GROUND 并断桨）优先。
  on_ground_height: 0.20

# 检测有效区域（2026-11-22）：只接受中心落在图像中间带的目标，排除最上方、
# 最下方各一段。悬停时"前面一个格子"的目标常出现在图像上/下边缘，容易误触发
# 投放；比例按现场相机画面调整，单项限制在 0..0.45，默认各 0.25（即 cy 在
# 0.25H..0.75H 之间才算有效）。
detection:
  exclude_top_ratio: 0.25
  exclude_bottom_ratio: 0.25
  # 目标确认方式（危险品/救援共用；各投放段内写同名键可单独覆盖）：
  #   vote_mode: none   = 最近一帧命中即确认（2026-11-25 起默认，VLM 方案用）；
  #              time   = 时间窗投票：最近 vote_window 秒内的命中比例；
  #              frames = 帧数窗投票：最近 vote_frames 帧的命中比例。
  #   none 的理由：VLM 每次触发只产生一个判定，OpenCV 跟随期间重复发布同一结论，
  #   再投票没有额外信息；max_age 仍然保证检测是新鲜的。
  #   注意：换回 TensorRT YOLO 时应改回 time/frames——YOLO 是逐帧识别，单帧确认会
  #   放大误检（2026-11 曾出现边缘目标误触发）。
  #   vote_window: 时间窗宽度（秒），仅 time 模式生效。
  #   vote_frames: frames 模式=窗口帧数；time 模式=窗口内最少投票数。
  #   vote_ratio:  time/frames 共用的命中比例阈值。
  vote_mode: none
  vote_window: 0.5
  vote_frames: 5
  vote_ratio: 0.60

# 物资投放机构（px4_servo 四路，实际接口为 PWM_MAIN5..8）：
#   逻辑 1 号输出 / MAIN5（1143）：下放 3/4 号物资到底层；
#   逻辑 2 号输出 / MAIN6（1143）：与 1 号同步下放；
#   逻辑 3 号输出 / MAIN7（2500）：投放 1 号（消防）、3 号（救援）；
#   逻辑 4 号输出 / MAIN8（2500）：投放 2 号（救援）、4 号（救援）。
#   服务前缀 /servo1../servo4 对应上面四路逻辑输出；动作后舵机 hold_s 自动回 500。
# 四种物资按 1→2→3→4 顺序投放，不一定装满；救援物资在 E/F/G 每确认一次投放一个，
# 依次消耗 2、3、4 号，用完即止。
#
# 危险品投放（2026-10-31 起默认启用）。开启后：在 hazard_drop/points 里的航点连续稳定悬停
# hover_seconds 秒，且 detection 段的投票窗口确认"危险品"时，先在位置控制下降到离地 height，
# 依次执行 hazard_drop/steps 里的舵机动作（默认 /servo3/push = 1 号物资），
# 再爬回该航点高度继续任务。到点后最多等 wait_timeout 秒，超时只告警并继续任务，
# 不中止飞行。height 以起飞原点为基准（与 landing/approach_height 同一基准）。启用时预检要求
# 所有投放服务可用，否则拒绝起飞——宁可地面报错，也不要飞完一圈才发现投放没发生。
hazard_drop:
  enabled: true             # true 时启用；也可用 --hazard-drop / --no-hazard-drop 覆盖
  points: [C, D]            # 允许投放的航点；C、D 都在 0.8m 高度悬停
  label: 危险品             # 检测标签按子串匹配；YOLO label_names 里叫 "危险品标识"
  min_confidence: 0.70      # 单帧最低置信度（YOLO 节点自身已按 conf_thres=0.60 过滤）
  # 单帧里可能出现多个图案：只认"离图像中心最近的那一个"（无人机悬在投放目标正上方），
  # 再判它是不是 label、置信度够不够。是否确认真危险品由 detection 段的投票窗口决定；
  # 需要单独覆盖时在本段写 vote_mode/vote_window/vote_frames/vote_ratio 同名键。
  hover_seconds: 3.0        # 到点后连续稳定悬停多久才允许下降（与 arrival_dwell 一致）
  # 到点后最多等多久检测；超时告警并按原任务流继续。
  # 2026-11-25：8.0 → 15.0。VLM 单次识别约 5–7.5 s，确认后连续发布约 4 s；
  # 15 s 只留给“还没有结果”或请求失败。识别为其它标识时立即飞往下一点。
  wait_timeout: 15.0
  height: 0.15              # 下降到离地高度（米，相对起飞原点）
  speed: 0.15               # 下降/爬升速度上限；不得大于 direct/max_speed
  tolerance: 0.02           # 高度到位判据（实测 z ≤ 目标 z + 该值）
  timeout: 20.0             # 单次下降或爬升超时；爬升超时按保护降落处理
  push_wait: 2.5            # dry_run 测试模式下低空保持时间；实际舵机保持时间见 steps/hold
  max_age: 0.5              # 检测消息超过该时长没有更新，视为检测丢失
  once: true                # 全程最多投放一次；false 时 C、D 两点都会各投一次
  # 1 号消防物资：MAIN7 500→2500，px4_servo hold_s=2s 后自动回 500
  # offset_body: [前, 左] 米 —— 挂点相对机体中心的位置；机体反向后移，让挂点对准航点
  steps:
    - services: [/servo3/push]
      hold: 3.0
  offset_body: [0.075, 0.0]

# 救援物资（2026-11-14 起默认启用，当前 dry_run=true 只测试降高度）。
# E/F/G 每确认一次"救助人员"投放一个救援物资，按 payloads 列表顺序消耗：
#   第 1 次 → 2 号（/servo4 → MAIN8，500→2500）
#   第 2 次 → 先 /servo1 + /servo2（MAIN5/6）同时打到 1143 把 3/4 号下放到底层，
#             再 /servo3（MAIN7）投放 3 号
#   第 3 次 → 4 号（/servo4 → MAIN8）
# 用完即止；整场只检测到一次就只投 2 号，3/4 保持在下层。
# once: false —— 每个点独立判断；dry_run: true 时只降高度、不调用舵机。
# 测试通过后把 dry_run 改成 false 即进入真实投放。
rescue_drop:
  enabled: true
  dry_run: true
  once: false
  points: [E, F, G]
  label: 救助人员
  min_confidence: 0.70
  # 投票参数默认取 detection 段；需要单独覆盖时在本段写同名键。
  hover_seconds: 3.0
  # 与 hazard_drop 同步：15 s（VLM 约 5–7.5 s，再加约 4 s 连续发布）
  wait_timeout: 15.0
  height: 0.15
  speed: 0.15
  tolerance: 0.02
  timeout: 20.0
  push_wait: 2.5
  max_age: 0.5
  # offset_body: [前, 左] 米；1/3 号在机体中心前方 7.5cm，2/4 号在正后方 7.5cm
  payloads:
    - steps:
        - {services: [/servo4/push], hold: 3.0}                    # 2 号救援物资
      offset_body: [-0.075, 0.0]
    - steps:
        - {services: [/servo1/push, /servo2/push], hold: 3.0}      # 下放 3/4 号到底层
        - {services: [/servo3/push], hold: 3.0}                    # 3 号救援物资
      offset_body: [0.075, 0.0]
    - steps:
        - {services: [/servo4/push], hold: 3.0}                    # 4 号救援物资
      offset_body: [-0.075, 0.0]

mission:
  publish_hz: 50.0
  startup_timeout: 10.0
  planner_first_command_timeout: 2.0
  planner_timeout: 45.0
  direct_timeout: 30.0
  # 到点后连续稳定悬停多久再发下一段。2026-10-31：C、D、E、F、G 要求悬停 3s，因此设为 3.0。
  # 这个值同时作用于 B（B 不再是经过点，停下稳定后从静止规划 B→C，避免带着速度进 139°
  # 折返导致优化器超速被拒而急停）；B 因此也是 3s。H 是经过点、不悬停；I 用下面 hover_seconds。
  arrival_dwell: 3.0
  hover_seconds: 3.0
  pass_radius: 0.30
  landing_ack_timeout: 2.0
  # 2026-10-31 实测：PX4Ctrl 进入 AUTO_LAND 后要持续下沉到"期望高度比实测低 0.5m 且速度
  # <0.1m/s 持续 3s"才判落地，随后还要等 PX4 确认 ON_GROUND（本机不报，最多再等 5s）。
  # 这段在实测飞行里约 23s + 5s，25s 会先超时，因此放宽到 45s；只有实测仍不在地面才报超时。
  landing_timeout: 45.0
  # 规划段里"Planner 不再推进参考位置"的判据：planner_cmd 的参考位置在
  # stalled_command_timeout 秒内前进不足 safety/motion_distance（0.04m）、且实测离目标超过
  # safety/position_tolerance 时，按"Planner 只给静止指令"中止，并报出参考停在距目标多远。
  # 区别于"参考在推进但飞机没跟上"（那仍由 safety/motion_timeout 位移看门狗负责）。
  stalled_command_timeout: 2.0

safety:
  position_tolerance: 0.10
  yaw_tolerance_deg: 10.0
  arrival_speed: 0.20
  telemetry_timeout: 0.30
  # LIO /Odometry 是 10 Hz 话题，实测间隔中位数 0.098s、p99 0.204s、最大 0.346s，
  # 不能套用 0.30s 的高频遥测超时：2026-10-29 起飞阶段因此误判 0.312s 断更而中止任务。
  lio_timeout: 1.0
  # 起飞前实时性硬门禁（2026-11-20 事故后加入）：以下任一不满足就拒绝 --execute。
  # 事故链：faster-lio 积压 10–15 s → EKF 报 "odom time out of buffer" → EKF 高度错误
  # → PX4 融合错误视觉一路爬升撞顶。
  lio_max_delay: 0.30          # /Odometry 时间戳落后上限（秒）
  lio_min_rate: 8.0            # 起飞前 2 s 内实测 /Odometry 频率下限（Hz）
  preflight_lio_seconds: 2.0   # 实时性采样时长
  ekf_error_window: 30.0       # 检查最近多少秒内的 EKF 超时告警
  ekf_error_limit: 0           # 该窗口内允许的 EKF 超时告警条数（0 = 一条都不允许）
  fcu_timeout: 3.0
  rc_timeout: 0.50
  map_timeout: 2.0
  planner_command_timeout: 1.00
  max_header_age: 0.30
  max_future_stamp: 0.05
  motion_timeout: 3.0
  motion_distance: 0.04
  max_tracking_error: 0.60
  # 规划速度 0.24m/s：Planner 接受上限 0.59（max_vel 0.24 + vel_tolerance 0.35；
  # 2026-10-31 0.30→0.32（0.56）；2026-11-24 实测峰值 0.575 超过 0.56、D 点又贴近障碍，
  # 经飞手同意放宽到 0.35（0.59），仍低于本文件的 max_command_speed 0.60）。
  # 指令检查留余量到 0.60，实测上限 0.65（PX4Ctrl 反馈钳位 0.50）。
  # 注意：max_command_speed 必须高于 Planner 的接受上限，否则 Planner 合格的轨迹会被任务脚本拦下。
  max_measured_speed: 0.65
  max_command_speed: 0.60
  max_command_acceleration: 2.0
  max_command_jerk: 10.0
  # 估计器健康：只看 EKF 与 LIO 的位置一致性。LIO header.stamp 不参与中止判定
  # （2026-10-26 决定，2026-10-29 起飞阶段再次误判后确认删除），只保留接收超时 lio_timeout。
  # max_ekf_lio_divergence 填 0 即关闭本项检查。
  max_ekf_lio_divergence: 0.35
  divergence_grace: 0.5
  preflight_estimator_seconds: 2.0
  # 距起飞原点的水平围栏；0 表示不启用。启用前确认所有航点都在半径内（预检会校验）。
  max_distance_from_origin: 0.0

topics:
  odom: /ekf/ekf_odom
  lio: /Odometry
  imu: /mavros/imu/data
  fcu: /mavros/state
  extended: /mavros/extended_state
  rc: /mavros/rc/in
  ctrl: /px4ctrl/state
  cloud: /cloud_registered
  map: /drone_0_diff_planner_node/grid_map/occupancy_inflate
  planner_cmd: /drone_0_mission/planner_cmd
  output_cmd: /setpoints_cmd
  goal: /goal
  stop: /mandatory_stop_to_planner
  land: /px4ctrl/takeoff_land
  status: /drone_0_mission/state
  # YOLO 检测结果（std_msgs/String，JSON：detections[].label/confidence）。
  # 危险品或救援投放启用时才订阅。
  detections: /yolo/detections
  # 单次识别触发（std_msgs/Bool）。到达 C/D 发 false，做一次危险品识别；
  # 到达 E/F/G 发 true，做一次人像识别。不是持续开关。
  yolo_enable: /yolo/enable