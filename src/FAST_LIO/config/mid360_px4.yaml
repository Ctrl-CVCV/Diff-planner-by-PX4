common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/mavros/imu/data_raw"
    time_sync_en: false
    # Definition used by FAST-LIO: lidar timestamp + offset = IMU timestamp.
    # Calibrated by LI-Init on 2026-10-17 18:14:23; FAST-LIO subtracts this value from IMU stamps.
    time_offset_lidar_to_imu: -0.068406

preprocess:
    lidar_type: 1
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 100.0
    # Keep false after copying the LI-Init calibration below.
    extrinsic_est_en: false
    # LiDAR pose expressed in the IMU body frame: p_I = R_LI * p_L + T_LI.
    # Refinement result from LiDAR_IMU_Init; p_I = R_LI * p_L + T_LI.
    extrinsic_T: [0.006849, -0.034990, 0.069355]
    extrinsic_R: [ 0.858277, -0.017062,  0.512903,
                   0.026414,  0.999591, -0.010949,
                  -0.512507,  0.022946,  0.858377]

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: 100
