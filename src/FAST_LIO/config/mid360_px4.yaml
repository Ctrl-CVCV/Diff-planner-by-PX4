common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/mavros/imu/data_raw"
    time_sync_en: false
    # Definition used by FAST-LIO: lidar timestamp + offset = IMU timestamp.
    # Calibrated by LI-Init on 2026-11-13 (airframe reinstalled); FAST-LIO
    # subtracts this value from IMU stamps.
    time_offset_lidar_to_imu: -0.07625571

preprocess:
    lidar_type: 1
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 100.0
    # Keep false after copying the LI-Init calibration below.
    extrinsic_est_en: false
    # LiDAR pose expressed in the IMU body frame: p_I = R_LI * p_L + T_LI.
    # LiDAR_IMU_Init Final Result, 2026-11-13 (airframe reinstalled):
    # Euler 0.592708 / 31.084524 / 0.506819 deg; |T| = 0.0965 m.
    # Checks: 1.14 deg from the 2026-10-17 accepted rotation, gravity residual
    # 2.1 deg after rotating into the IMU frame, det(R) = 1.
    extrinsic_T: [0.032600, 0.027755, 0.086446]
    extrinsic_R: [ 0.856373, -0.003504,  0.516346,
                   0.007575,  0.999955, -0.005777,
                  -0.516302,  0.008859,  0.856361]

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: true
    interval: 100
