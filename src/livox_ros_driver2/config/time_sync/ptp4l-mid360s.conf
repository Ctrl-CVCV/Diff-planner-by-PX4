[global]
# Jetson eth0 has no PHC, so use software timestamping (-S on command line).
time_stamping          software
network_transport      UDPv4
delay_mechanism        E2E
# Prefer the companion computer as grandmaster on the direct LiDAR link.
priority1              10
priority2              10
logging_level          6
summary_interval       0

[eth0]
